version: '3.8'

services:
  # Servicio de Go (Backend principal)
  backend:
    build: ./backend
    container_name: unach-backend-go
    ports:
      - "3000:3000"
    restart: always
    environment:
      # CAMBIO IMPORTANTE: Usamos 'db' en lugar de 'localhost'
      - DB_URL=postgresql://postgres:unah2026@db:5432/sistema_unach?sslmode=disable
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Servicio de Python (Microservicio de Notificaciones)
  python-notif:
    build: ./microservicio
    container_name: unach-python-notif
    ports:
      - "8001:8001"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # ESTO ES LO QUE TE FALTABA: El servicio de la Base de Datos
  db:
    image: postgres:15-alpine
    container_name: unach-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=unah2026
      - POSTGRES_DB=sistema_unach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: