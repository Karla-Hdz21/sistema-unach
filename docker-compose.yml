version: '3.8'

services:
  # Servicio de Go (Backend principal)
  backend:
    build: ./backend
    container_name: unach-backend-go
    ports:
      - "3000:3000"
    restart: always
    environment:
      - DB_URL=postgresql://postgres:unah2026@localhost:5432/sistema_unach?sslmode=disable
    # Esto asegura que el backend no intente arrancar antes que la base de datos si la tuvieras aquí
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Servicio de Python (Microservicio de Notificaciones)
  python-notif:
    build: ./microservicio
    container_name: unach-python-notif
    ports:
      - "8001:8001"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"